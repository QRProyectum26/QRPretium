<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Stand Inmersivo - QRPretium</title>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pizarra: '#1E293B',
                        pizarraOscura: '#0F172A',
                        naranja: '#F97316',
                        verdeQR: '#0D9488', 
                        verdeVivo: '#10B981'
                    }
                }
            }
        }
    </script>
    <style>
        /* Menú Hamburguesa */
        .menu-desplegable { 
            display: none; 
            background-color: rgba(241, 245, 249, 0.95); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .menu-desplegable.activo { display: block; }
        
        /* Submenús Popups */
        .submenu-popup {
            display: none;
            position: absolute;
            left: 100%; 
            top: 0;
            margin-left: 4px;
            background-color: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            min-width: 180px;
            z-index: 100;
        }
        @media (max-width: 640px) {
            .submenu-popup { left: 50%; }
        }
        .submenu-popup.activo { display: block; }

        /* Colores Menú */
        .menu-item { color: #0f172a; transition: all 0.2s; position: relative; }
        .menu-item:hover, .menu-item.active { background-color: rgba(13, 148, 136, 0.1); color: #0D9488; }
        .submenu-item { color: #334155; font-weight: 500; display: block; padding: 8px 12px; font-size: 12px; }
        .submenu-item:hover { color: #0D9488; background-color: rgba(13, 148, 136, 0.05); }

        /* NEX */
        .tarjeta-nex { box-shadow: 0 4px 15px rgba(249, 115, 22, 0.4); transition: all 0.3s ease; }
        .tarjeta-nex:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(249, 115, 22, 0.8); }
        .globo-nex { position: absolute; top: 110%; right: 0; width: 260px; z-index: 100; }
        
        .vista-oculta { display: none; }
        
        /* Spinner de carga */
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #0D9488; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen" onclick="cerrarMenuSiClickFuera(event)">

    <!-- ================= HEADER DINÁMICO ================= -->
    <header id="headerPrincipal" class="bg-slate-900 text-white sticky top-0 z-50 shadow-md transition-all duration-300">
        <div class="max-w-xl mx-auto px-4 py-3 flex items-start justify-between relative">
            
            <!-- LADO IZQUIERDO: LOGOS Y DATOS -->
            <div class="flex flex-col z-10 w-full pr-20"> 
                
                <!-- FILA 1: Logo Feria y Nombre Feria (Hardcodeado por ahora) -->
                <div class="flex items-center gap-1.5 mb-1">
                    <img src="https://cdn-icons-png.flaticon.com/512/869/869636.png" alt="Logo Feria" class="w-4 h-4 rounded bg-white p-0.5 object-contain">
                    <span class="text-[9px] text-slate-400 font-bold uppercase tracking-wider">Expo ConstruTech 2026</span>
                </div>

                <!-- FILA 2: Link del Pabellón -->
                <div id="contenedorPabellonHeader" class="hidden mb-1 flex-col items-center justify-center text-center">
                    <div class="flex items-center justify-center gap-1">
                        <span id="flechaVolverPabellon" class="hidden text-verdeQR text-xs">←</span>
                        <a href="#" onclick="volverAlPabellonDesdeHeader(event)" id="linkPabellonHeader" class="text-xs font-black text-verdeQR uppercase hover:underline cursor-pointer">
                            Pabellón
                        </a>
                    </div>
                    <span id="descPabellonHeader" class="text-[11px] text-slate-300 italic mt-0.5"></span>
                </div>

                <!-- FILA 3: Logo y Nombre del Expositor -->
                <div id="contenedorExpositor" class="hidden items-start gap-2 mt-1">
                    <div class="flex flex-col items-center flex-shrink-0">
                        <img id="imgLogoExpositor" src="https://cdn-icons-png.flaticon.com/512/869/869636.png" alt="Logo Empresa" class="w-8 h-8 rounded bg-white p-0.5 object-contain">
                        <span id="txtCodigoStand" class="text-[11px] text-slate-300 font-mono font-bold mt-1">B3-000</span>
                    </div>
                    
                    <div class="flex flex-col leading-tight w-full">
                        <span id="txtNombreExpositor" class="font-black text-sm uppercase text-white truncate">Cargando...</span>
                        <button onclick="alert('Abre modal con info de la empresa')" class="text-[9px] text-slate-400 font-bold hover:text-white transition mt-0.5 text-left">+ Info Empresa</button>
                        <span id="txtSectorStand" class="text-[10px] text-verdeQR font-bold mt-0.5">(Sector)</span>
                    </div>
                </div>
            </div>

            <!-- LADO DERECHO: NEX -->
            <div class="absolute right-4 top-3 flex-shrink-0 z-10">
                <div id="contenedorNex" onclick="toggleGloboNex(event)" class="tarjeta-nex w-24 h-32 bg-slate-950 border-2 border-orange-500 rounded-xl overflow-hidden cursor-pointer relative group flex flex-col justify-between p-1">
                    <div class="bg-orange-500 text-white font-black text-[8px] tracking-wider text-center py-0.5 px-1 rounded uppercase z-10">
                        NEX • Asesor IA
                    </div>
                    <div class="w-full h-20 overflow-hidden rounded relative my-auto">
                        <img id="avatarNexImg" src="stand_ia/nex.jpg" alt="NEX Robot" class="w-full h-full object-cover object-top transition-transform duration-300 group-hover:scale-105">
                    </div>
                    <div class="bg-slate-900 text-orange-400 text-[8px] font-extrabold text-center py-0.5 rounded border border-slate-800 flex items-center justify-center gap-1">
                        <span>🎙️</span> <span>Consultar</span>
                    </div>
                </div>

                <div id="globoNex" class="globo-nex hidden bg-white border-2 border-orange-500 rounded-xl p-3 shadow-xl" onclick="event.stopPropagation()">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-[10px] font-bold text-orange-600">🤖 NEX Asesor</span>
                        <button onclick="toggleGloboNex(event)" class="text-gray-400 font-bold text-xs">✕</button>
                    </div>
                    <p id="textoNex" class="text-xs text-gray-700 leading-tight mb-2">¡Hola! Cargando datos de la feria...</p>
                    
                    <button id="btnNexVolver" onclick="volverAlPabellonDesdeHeader(event)" class="hidden w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-[10px] py-1.5 rounded transition border border-slate-300">
                        ← Volver a los Stands del Pabellón
                    </button>
                </div>
            </div>
        </div>

        <!-- BARRA DE MENÚ HAMBURGUESA -->
        <div class="bg-slate-800 border-t border-slate-700 relative">
            <div class="max-w-xl mx-auto px-4 py-0.5 flex items-center justify-between relative z-20">
                <div class="flex items-center gap-3">
                    <button onclick="irAlPredio()" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-naranja font-bold px-2 py-0.5 rounded border border-slate-600 transition">Predio</button>
                    
                    <button onclick="toggleMenu(event)" id="btnHamburguesa" class="flex items-center gap-1.5 text-xs font-bold text-white hover:text-verdeQR transition py-0.5">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                        Menú Feria
                    </button>
                </div>
            </div>

            <!-- MENÚ DESPLEGABLE -->
            <div id="menuDesplegable" class="menu-desplegable absolute top-full left-0 w-full shadow-2xl z-50 max-h-[70vh] overflow-y-auto border-b border-slate-300" onclick="event.stopPropagation()">
                <div class="max-w-xl mx-auto p-2 space-y-1 text-sm font-bold">
                    <!-- (El código del menú hamburguesa se mantiene igual, lo omito por brevedad) -->
                    <div class="menu-item w-full text-left p-2 rounded flex justify-between items-center cursor-pointer" onclick="toggleSubmenu(event, 'submenuMapa')">
                        🗺️ Mapa <span class="text-[10px]">▶</span>
                        <div id="submenuMapa" class="submenu-popup">
                            <a href="#" onclick="seleccionarMenu('Acreditaciones')" class="submenu-item">Acreditaciones</a>
                            <a href="#" onclick="seleccionarMenu('Pabellones')" class="submenu-item">Pabellones</a>
                        </div>
                    </div>
                    <div class="menu-item w-full text-left p-2 rounded cursor-pointer" onclick="seleccionarMenu('Programa')">📅 Programa</div>
                    <!-- ... resto de los menús ... -->
                </div>
            </div>
        </div>
    </header>

    <!-- ================= CONTENIDO PRINCIPAL ================= -->
    <main class="max-w-xl mx-auto p-4 pb-20">

        <!-- VISTA 1: MAPA DEL PREDIO -->
        <div id="vistaPredio">
            <div class="w-full h-64 bg-slate-300 rounded-2xl border-2 border-slate-400 flex flex-col items-center justify-center relative overflow-hidden shadow-inner">
                <span class="text-4xl mb-2">🗺️</span>
                <p class="text-slate-600 font-bold">Mapa de Fexpocruz (Aquí va Leaflet)</p>
                <!-- Los botones de pabellones ahora se cargan dinámicamente desde Supabase -->
                <div id="contenedorPabellones" class="mt-4 flex gap-2 flex-wrap justify-center">
                    <div class="loader"></div>
                </div>
            </div>
        </div>

        <!-- VISTA 2: GRILLA DE STANDS -->
        <div id="vistaPabellon" class="vista-oculta">
            <!-- Contenedor dinámico para los stands -->
            <div id="contenedorStands" class="grid grid-cols-3 sm:grid-cols-4 gap-3 mt-2">
                <div class="loader col-span-4"></div>
            </div>
        </div>

        <!-- VISTA 3: GRILLA DE CÓDIGOS -->
        <div id="vistaStand" class="vista-oculta">
            <!-- Contenedor dinámico para los productos -->
            <div id="contenedorProductos" class="grid grid-cols-4 sm:grid-cols-5 gap-3 mt-2">
                <div class="loader col-span-5"></div>
            </div>
        </div>

    </main>

    <!-- ================= LÓGICA DE NAVEGACIÓN Y SUPABASE ================= -->
    <script>
        // 1. CONFIGURACIÓN DE SUPABASE
        const SUPABASE_URL = 'https://zbnuunaguciupyyzploq.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_TbHxIMFoRE6_Nu8MEUmtvA_ubsi9qFB';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Variables globales
        let pabellonActual = { id: null, nombre: '', descripcion: '' };
        let timerCierreMenu = null;
        let timerCierreNex = null;

        // 2. LÓGICA DE CARGA INICIAL (Traer Pabellones)
        async function cargarPabellones() {
            try {
                // Buscamos los pabellones de la feria de prueba (ID: 11111111-1111-1111-1111-111111111111)
                const { data, error } = await supabaseClient
                    .from('pabellones')
                    .select('*')
                    .eq('feria_id', '11111111-1111-1111-1111-111111111111');

                if (error) throw error;

                const contenedor = document.getElementById('contenedorPabellones');
                contenedor.innerHTML = '';

                if (data.length === 0) {
                    contenedor.innerHTML = '<p class="text-slate-600 text-xs">No hay pabellones cargados.</p>';
                    return;
                }

                data.forEach(pab => {
                    // Usamos el nombre y el tipo como descripción
                    const boton = document.createElement('button');
                    boton.className = "bg-slate-800 text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-slate-700 transition";
                    boton.innerText = pab.nombre;
                    boton.onclick = () => entrarAlPabellon(pab.id, pab.nombre, pab.tipo);
                    contenedor.appendChild(boton);
                });

                document.getElementById('textoNex').innerText = "¡Hola! Cargamos los pabellones. Seleccioná uno para empezar.";
                document.getElementById('globoNex').classList.remove('hidden');

            } catch (error) {
                console.error('Error al cargar pabellones:', error);
                document.getElementById('textoNex').innerText = "Error al conectar con la base de datos.";
                document.getElementById('globoNex').classList.remove('hidden');
            }
        }

        // 3. CARGAR STANDS DE UN PABELLÓN
        async function cargarStands(pabellonId) {
            const contenedor = document.getElementById('contenedorStands');
            contenedor.innerHTML = '<div class="loader col-span-4"></div>';

            try {
                const { data, error } = await supabaseClient
                    .from('stands')
                    .select('*')
                    .eq('pabellon_id', pabellonId);

                if (error) throw error;

                contenedor.innerHTML = '';

                if (data.length === 0) {
                    contenedor.innerHTML = '<p class="text-slate-500 text-xs col-span-4 text-center">No hay stands en este pabellón.</p>';
                    return;
                }

                // Traemos los datos del expositor para cada stand (usando tu tabla standargentina)
                // Nota: Para simplificar, haremos la consulta de expositores después. Por ahora mostramos el número.
                data.forEach(stand => {
                    const boton = document.createElement('button');
                    boton.className = "bg-white border-2 border-slate-300 hover:border-verdeQR rounded-xl p-3 flex flex-col items-center justify-center shadow-sm transition";
                    boton.innerHTML = `
                        <span class="text-[10px] text-slate-500 uppercase font-bold">Stand</span>
                        <span class="text-sm font-black text-slate-800">${stand.numero}</span>
                    `;
                    // Al hacer clic, entramos al stand. Pasamos el ID interno y el número visible.
                    boton.onclick = () => entrarAlStand(stand.id, stand.numero, stand.rubro);
                    contenedor.appendChild(boton);
                });

            } catch (error) {
                console.error('Error al cargar stands:', error);
                contenedor.innerHTML = '<p class="text-red-500 text-xs col-span-4 text-center">Error al cargar stands.</p>';
            }
        }

        // 4. CARGAR PRODUCTOS DE UN STAND
        async function cargarProductos(standId) {
            const contenedor = document.getElementById('contenedorProductos');
            contenedor.innerHTML = '<div class="loader col-span-5"></div>';

            try {
                // Primero, buscamos al expositor asignado a este stand en tu tabla 'standargentina'
                const { data: expositores, error: errorExp } = await supabaseClient
                    .from('standargentina')
                    .select('id, empresa_stand, logo')
                    .eq('stand_id', standId);

                if (errorExp) throw errorExp;

                if (expositores.length === 0) {
                    contenedor.innerHTML = '<p class="text-slate-500 text-xs col-span-5 text-center">Este stand no tiene expositor asignado.</p>';
                    return;
                }

                const expositor = expositores[0];
                
                // Actualizamos el header con los datos del expositor
                document.getElementById('txtNombreExpositor').innerText = expositor.empresa_stand;
                if(expositor.logo) document.getElementById('imgLogoExpositor').src = expositor.logo;

                // Ahora buscamos los productos de ese expositor en tu tabla 'standproductos'
                const { data: productos, error: errorProd } = await supabaseClient
                    .from('standproductos')
                    .select('*')
                    .eq('expositor_id', expositor.id);

                if (errorProd) throw errorProd;

                contenedor.innerHTML = '';

                if (productos.length === 0) {
                    contenedor.innerHTML = '<p class="text-slate-500 text-xs col-span-5 text-center">Este expositor no tiene productos cargados.</p>';
                    return;
                }

                productos.forEach(prod => {
                    const boton = document.createElement('button');
                    boton.className = "bg-pizarraOscura border-2 border-slate-600 hover:border-naranja text-white rounded-lg p-3 flex flex-col items-center justify-center shadow-md transition";
                    boton.innerHTML = `<span class="text-xl font-black text-verdeVivo">${prod.codigo || '---'}</span>`;
                    boton.onclick = () => alert(`Abre etiqueta del producto ${prod.codigo}:\n${prod.nombre}\nPrecio: $${prod.precio}`);
                    contenedor.appendChild(boton);
                });

            } catch (error) {
                console.error('Error al cargar productos:', error);
                contenedor.innerHTML = '<p class="text-red-500 text-xs col-span-5 text-center">Error al cargar productos.</p>';
            }
        }

        // ================= FUNCIONES DE NAVEGACIÓN =================
        function entrarAlPabellon(id, nombre, descripcion) {
            pabellonActual = { id: id, nombre: nombre, descripcion: descripcion };
            
            document.getElementById('vistaPredio').classList.add('vista-oculta');
            document.getElementById('vistaStand').classList.add('vista-oculta');
            document.getElementById('vistaPabellon').classList.remove('vista-oculta');
            
            // Header
            document.getElementById('contenedorPabellonHeader').classList.remove('hidden');
            document.getElementById('contenedorPabellonHeader').classList.add('flex');
            document.getElementById('linkPabellonHeader').innerText = nombre;
            document.getElementById('descPabellonHeader').innerText = descripcion;
            document.getElementById('descPabellonHeader').classList.remove('hidden');
            document.getElementById('flechaVolverPabellon').classList.add('hidden'); 
            
            document.getElementById('contenedorExpositor').classList.add('hidden');
            
            // NEX
            document.getElementById('textoNex').innerText = `Ya estás en el ${nombre}. Elegí el stand que quieras visitar.`;
            document.getElementById('globoNex').classList.remove('hidden');
            document.getElementById('btnNexVolver').classList.add('hidden');
            
            cerrarMenuYSubmenus();

            // Cargar los stands de este pabellón desde Supabase
            cargarStands(id);
        }

        function entrarAlStand(standId, codigoStand, sector) {
            document.getElementById('vistaPredio').classList.add('vista-oculta');
            document.getElementById('vistaPabellon').classList.add('vista-oculta');
            document.getElementById('vistaStand').classList.remove('vista-oculta');
            
            // Header: Ocultar descripción del pabellón y mostrar flechita
            document.getElementById('descPabellonHeader').classList.add('hidden');
            document.getElementById('flechaVolverPabellon').classList.remove('hidden');
            
            // Header: Datos del Expositor (Nombre y logo se actualizan cuando cargan los productos)
            document.getElementById('contenedorExpositor').classList.remove('hidden');
            document.getElementById('contenedorExpositor').classList.add('flex');
            
            document.getElementById('txtCodigoStand').innerText = codigoStand; 
            document.getElementById('txtSectorStand').innerText = `(${sector || 'General'})`; 
            
            // NEX
            document.getElementById('textoNex').innerText = `¡Bienvenido al stand ${codigoStand}! Hacé clic en un código para ver los detalles. Cualquier cosa estoy aquí por cualquier consulta.`;
            document.getElementById('globoNex').classList.remove('hidden');
            document.getElementById('btnNexVolver').classList.remove('hidden');
            
            clearTimeout(timerCierreNex);
            timerCierreNex = setTimeout(() => {
                document.getElementById('globoNex').classList.add('hidden');
            }, 5000);

            // Cargar productos
            cargarProductos(standId);
        }

        function volverAlPabellonDesdeHeader(e) {
            if(e) e.preventDefault();
            document.getElementById('vistaStand').classList.add('vista-oculta');
            document.getElementById('vistaPabellon').classList.remove('vista-oculta');
            
            // Restaurar Header
            document.getElementById('contenedorExpositor').classList.add('hidden');
            document.getElementById('contenedorExpositor').classList.remove('flex');
            document.getElementById('descPabellonHeader').classList.remove('hidden'); 
            document.getElementById('flechaVolverPabellon').classList.add('hidden');
            
            document.getElementById('globoNex').classList.add('hidden');
            clearTimeout(timerCierreNex);
        }

        function irAlPredio() {
            document.getElementById('vistaPabellon').classList.add('vista-oculta');
            document.getElementById('vistaStand').classList.add('vista-oculta');
            document.getElementById('vistaPredio').classList.remove('vista-oculta');
            
            document.getElementById('contenedorPabellonHeader').classList.add('hidden');
            document.getElementById('contenedorPabellonHeader').classList.remove('flex');
            document.getElementById('contenedorExpositor').classList.add('hidden');
            document.getElementById('contenedorExpositor').classList.remove('flex');
            
            document.getElementById('textoNex').innerText = "Volvimos al mapa principal. ¿A dónde querés ir ahora?";
            document.getElementById('globoNex').classList.remove('hidden');
            document.getElementById('btnNexVolver').classList.add('hidden');
            
            cerrarMenuYSubmenus();
            clearTimeout(timerCierreNex);
        }

        // ================= FUNCIONES DE UI (Menú, NEX) =================
        function toggleMenu(e) {
            if(e) e.stopPropagation();
            const menu = document.getElementById('menuDesplegable');
            if (menu.classList.contains('activo')) {
                cerrarMenuYSubmenus();
            } else {
                menu.classList.add('activo');
                clearTimeout(timerCierreMenu);
                timerCierreMenu = setTimeout(() => { cerrarMenuYSubmenus(); }, 10000); 
            }
        }

        function cerrarMenuYSubmenus() {
            document.getElementById('menuDesplegable').classList.remove('activo');
            document.querySelectorAll('.submenu-popup').forEach(el => el.classList.remove('activo'));
        }

        function cerrarMenuSiClickFuera(e) {
            const menu = document.getElementById('menuDesplegable');
            const btnHamburguesa = document.getElementById('btnHamburguesa');
            if (menu.classList.contains('activo') && !menu.contains(e.target) && !btnHamburguesa.contains(e.target)) {
                cerrarMenuYSubmenus();
            }
        }

        function toggleSubmenu(e, idSubmenu) {
            e.stopPropagation();
            const submenu = document.getElementById(idSubmenu);
            const estaAbierto = submenu.classList.contains('activo');
            document.querySelectorAll('.submenu-popup').forEach(el => el.classList.remove('activo'));
            if (!estaAbierto) submenu.classList.add('activo');
        }

        function seleccionarMenu(opcion) {
            cerrarMenuYSubmenus();
            document.getElementById('textoNex').innerText = `Buscando "${opcion}" en el mapa...`;
            document.getElementById('globoNex').classList.remove('hidden');
            document.getElementById('btnNexVolver').classList.add('hidden'); 
        }

        function toggleGloboNex(e) {
            if(e) e.stopPropagation();
            document.getElementById('globoNex').classList.toggle('hidden');
        }

        // 5. INICIALIZACIÓN
        window.onload = () => {
            cargarPabellones();
        };
    </script>
</body>
</html>
