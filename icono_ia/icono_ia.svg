<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%" id="dodecaedro-svg">
  <defs>
    <!-- Filtros de Neón y Resplandor (Glow) -->
    <filter id="glow-orange" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-green" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-yellow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-red" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!--
    GEOMETRÍA: pentágono central regular (centro 500,389 - radio 149.3)
    + 5 pentágonos laterales, cada uno es el reflejo EXACTO del central
    sobre uno de sus 5 lados. Todas las caras son pentágonos regulares
    congruentes, por eso ahora quedan uniformes y proporcionales.
  -->
  <g id="dodecaedro-container">

    <!-- Cara CENTRAL -->
    <polygon class="face" points="500,240 642,343 588,510 412,510 358,343" fill="#3a424d" stroke="#12161a" stroke-width="4" stroke-linejoin="round" />

    <!-- Cara Superior-Derecha (reflejo sobre el lado sup-derecho del centro) -->
    <polygon class="face" points="500,240 642,343 784,240 730,73 554,73" fill="#3b424c" stroke="#12161a" stroke-width="4" stroke-linejoin="round" />

    <!-- Cara Derecha -->
    <polygon class="face" points="642,343 588,510 730,613 872,510 818,343" fill="#323843" stroke="#12161a" stroke-width="4" stroke-linejoin="round" />

    <!-- Cara Inferior -->
    <polygon class="face" points="588,510 412,510 358,677 500,780 642,677" fill="#1e232a" stroke="#12161a" stroke-width="4" stroke-linejoin="round" />

    <!-- Cara Izquierda -->
    <polygon class="face" points="358,343 412,510 270,613 128,510 182,343" fill="#252b33" stroke="#12161a" stroke-width="4" stroke-linejoin="round" />

    <!-- Cara Superior-Izquierda -->
    <polygon class="face" points="500,240 358,343 216,240 270,73 446,73" fill="#2d333d" stroke="#12161a" stroke-width="4" stroke-linejoin="round" />

    <!--
      BISELES NEÓN: cada bisel es la MISMA polygon que su cara,
      escalada al 88% respecto del propio centro de esa cara.
      Al usar el mismo factor de escala para las 6, el grosor del
      borde queda idéntico y proporcional en todas.
    -->
    <g transform="translate(500,389) scale(0.88) translate(-500,-389)">
      <polygon class="neon-border" points="500,240 642,343 588,510 412,510 358,343" fill="none" stroke="#ff5500" stroke-width="6" stroke-linejoin="round" filter="url(#glow-orange)" />
    </g>
    <g transform="translate(642,194) scale(0.88) translate(-642,-194)">
      <polygon class="neon-border" points="500,240 642,343 784,240 730,73 554,73" fill="none" stroke="#ff5500" stroke-width="6" stroke-linejoin="round" filter="url(#glow-orange)" />
    </g>
    <g transform="translate(730,464) scale(0.88) translate(-730,-464)">
      <polygon class="neon-border" points="642,343 588,510 730,613 872,510 818,343" fill="none" stroke="#ff5500" stroke-width="6" stroke-linejoin="round" filter="url(#glow-orange)" />
    </g>
    <g transform="translate(500,631) scale(0.88) translate(-500,-631)">
      <polygon class="neon-border" points="588,510 412,510 358,677 500,780 642,677" fill="none" stroke="#ff5500" stroke-width="6" stroke-linejoin="round" filter="url(#glow-orange)" />
    </g>
    <g transform="translate(270,464) scale(0.88) translate(-270,-464)">
      <polygon class="neon-border" points="358,343 412,510 270,613 128,510 182,343" fill="none" stroke="#ff5500" stroke-width="6" stroke-linejoin="round" filter="url(#glow-orange)" />
    </g>
    <g transform="translate(358,194) scale(0.88) translate(-358,-194)">
      <polygon class="neon-border" points="500,240 358,343 216,240 270,73 446,73" fill="none" stroke="#ff5500" stroke-width="6" stroke-linejoin="round" filter="url(#glow-orange)" />
    </g>

    <!-- ÍCONO MÓDULO IA / CEREBRO (cara Superior-Izquierda) -->
    <g id="icon-brain" transform="translate(358, 194) rotate(-15) scale(0.55)">
      <path fill="none" stroke="#ffee00" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-yellow)" d="M -10 -45 C -35 -45 -55 -20 -40 10 C -58 25 -48 55 -20 60 C -30 78 -8 95 12 82 C 2 55 5 20 -10 -45 Z" />
      <path fill="none" stroke="#ffee00" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-yellow)" d="M 10 -45 C 35 -45 55 -20 40 10 C 58 25 48 55 20 60 C 30 78 8 95 -12 82 C -2 55 -5 20 10 -45 Z" />
      <path fill="none" stroke="#ffee00" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-yellow)" d="M -22 5 C -8 15 -12 35 -26 40 M 22 5 C 8 15 12 35 26 40" />
    </g>

    <!-- ÍCONO MICRÓFONO Y TEXTO (cara CENTRAL) -->
    <g id="icon-mic" transform="translate(500, 365)">
      <rect x="-16" y="-35" width="32" height="50" rx="16" fill="#00ff66" filter="url(#glow-green)" />
      <path fill="none" stroke="#00ff66" stroke-width="6" stroke-linecap="round" filter="url(#glow-green)" d="M -28 0 A 28 28 0 0 0 28 0" />
      <path fill="none" stroke="#00ff66" stroke-width="6" stroke-linecap="round" filter="url(#glow-green)" d="M 0 28 L 0 45 M -15 45 L 15 45" />

      <text id="status-text-title" x="0" y="80" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="2">ESCUCHANDO</text>
      <text id="status-text-sub1" x="0" y="100" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#00ff66" text-anchor="middle" letter-spacing="1">MODO VOZ</text>
      <text id="status-text-sub2" x="0" y="115" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#00ff66" text-anchor="middle" letter-spacing="1">ACTIVADO</text>
    </g>

    <!-- ÍCONO ÉXITO / CHECK (cara Izquierda) -->
    <g id="icon-check" transform="translate(270, 470) rotate(-10)">
      <path fill="none" stroke="#00ff66" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-green)" d="M -18 0 L -4 14 L 26 -14" />
    </g>

    <!-- ÍCONO ERROR / X (cara Derecha) -->
    <g id="icon-error" transform="translate(730, 470) rotate(8)">
      <path fill="none" stroke="#ff3344" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-red)" d="M -16 -16 L 16 16 M 16 -16 L -16 16" />
    </g>

  </g>
</svg>
