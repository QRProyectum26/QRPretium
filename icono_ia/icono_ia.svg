
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%" id="dodecaedro-svg">
  <defs>
    <!-- Filtros de Neón Reales con Resplandor (Glow) -->
    <filter id="glow-orange" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-green" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-yellow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-red" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Contenedor Principal del Dodecaedro con animación de flotación -->
  <g id="dodecaedro-container">
    
    <!-- CARAS BASE DE GEOMETRÍA 3D -->
    <polygon class="face" points="500,80 660,150 500,220 340,150" fill="#3b424c" stroke="#12161a" stroke-width="3" stroke-linejoin="round" />
    <polygon class="face" points="340,150 500,220 380,430 240,320 255,185" fill="#2d333d" stroke="#12161a" stroke-width="3" stroke-linejoin="round" />
    <polygon class="face" points="660,150 745,185 760,320 620,430 500,220" fill="#323843" stroke="#12161a" stroke-width="3" stroke-linejoin="round" />
    <polygon class="face" points="240,320 380,430 490,670 300,680 220,470" fill="#252b33" stroke="#12161a" stroke-width="3" stroke-linejoin="round" />
    <polygon class="face" points="620,430 760,320 780,470 700,680 490,670" fill="#1e232a" stroke="#12161a" stroke-width="3" stroke-linejoin="round" />
    <polygon class="face" points="500,220 620,430 490,670 380,430" fill="#3a424d" stroke="#12161a" stroke-width="3" stroke-linejoin="round" />

    <!-- BISELES DE NEÓN NARANJA -->
    <polygon class="neon-border" points="500,98 638,155 500,210 362,155" fill="none" stroke="#ff5500" stroke-width="10" stroke-linejoin="round" filter="url(#glow-orange)" />
    <polygon class="neon-border" points="350,168 480,222 376,410 258,318 270,200" fill="none" stroke="#ff5500" stroke-width="10" stroke-linejoin="round" filter="url(#glow-orange)" />
    <polygon class="neon-border" points="650,168 730,200 742,318 624,410 520,222" fill="none" stroke="#ff5500" stroke-width="10" stroke-linejoin="round" filter="url(#glow-orange)" />
    <polygon class="neon-border" points="255,332 375,418 472,642 312,652 238,465" fill="none" stroke="#ff5500" stroke-width="10" stroke-linejoin="round" filter="url(#glow-orange)" />
    <polygon class="neon-border" points="625,418 745,332 762,465 688,652 528,642" fill="none" stroke="#ff5500" stroke-width="10" stroke-linejoin="round" filter="url(#glow-orange)" />
    <polygon class="neon-border pulse-neon" points="500,245 598,422 490,642 402,422" fill="none" stroke="#ff5500" stroke-width="12" stroke-linejoin="round" filter="url(#glow-orange)" />

    <!-- ÍCONO MÓDULO IA / CEREBRO -->
    <g id="icon-brain" transform="translate(360, 275) rotate(-20) scale(0.6)">
      <path fill="none" stroke="#ffee00" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-yellow)" d="M -10 -45 C -35 -45 -55 -20 -40 10 C -58 25 -48 55 -20 60 C -30 78 -8 95 12 82 C 2 55 5 20 -10 -45 Z" />
      <path fill="none" stroke="#ffee00" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-yellow)" d="M 10 -45 C 35 -45 55 -20 40 10 C 58 25 48 55 20 60 C 30 78 8 95 -12 82 C -2 55 -5 20 10 -45 Z" />
      <path fill="none" stroke="#ffee00" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-yellow)" d="M -22 5 C -8 15 -12 35 -26 40 M 22 5 C 8 15 12 35 26 40" />
    </g>

    <!-- ÍCONO MICRÓFONO Y TEXTO INTERNO -->
    <g id="icon-mic" transform="translate(493, 370)">
      <rect x="-18" y="-50" width="36" height="58" rx="18" fill="#00ff66" filter="url(#glow-green)" />
      <path fill="none" stroke="#00ff66" stroke-width="7" stroke-linecap="round" filter="url(#glow-green)" d="M -32 -10 A 32 32 0 0 0 32 -10" />
      <path fill="none" stroke="#00ff66" stroke-width="7" stroke-linecap="round" filter="url(#glow-green)" d="M 0 22 L 0 42 M -18 42 L 18 42" />
      
      <text id="status-text-title" x="0" y="88" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22" fill="#12161a" text-anchor="middle" letter-spacing="2">ESCUCHANDO</text>
      <text id="status-text-sub1" x="0" y="110" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#1d232a" text-anchor="middle" letter-spacing="1">MODO VOZ</text>
      <text id="status-text-sub2" x="0" y="126" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#1d232a" text-anchor="middle" letter-spacing="1">ACTIVADO</text>
    </g>

    <!-- ÍCONO ÉXITO / CHECK -->
    <g id="icon-check" transform="translate(345, 530) rotate(-10)">
      <path fill="none" stroke="#00ff66" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-green)" d="M -22 2 L -5 20 L 32 -18" />
    </g>

    <!-- ÍCONO ERROR / X -->
    <g id="icon-error" transform="translate(625, 535) rotate(8)">
      <path fill="none" stroke="#ff3344" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-red)" d="M -20 -20 L 20 20 M 20 -20 L -20 20" />
    </g>

  </g>
</svg>
