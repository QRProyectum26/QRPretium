<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%" id="dodecaedro-svg">
  <defs>
    <!-- Filtros de Neón y Resplandor (Glow) -->
    <filter id="glow-orange" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-green" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-yellow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-red" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Contenedor Principal del Dodecaedro -->
  <g id="dodecaedro-container">
    
    <!-- GEOMETRÍA DE CARAS PENTAGONALES 3D -->
    <!-- Cara 1: Pentágono Central Frontal -->
    <polygon class="face" points="500,240 642,343 588,510 412,510 358,343" fill="#3a424d" stroke="#12161a" stroke-width="4" stroke-linejoin="round" />

    <!-- Cara 2: Pentágono Superior -->
    <polygon class="face" points="500,240 642,343 605,175 500,100 395,175" fill="#3b424c" stroke="#12161a" stroke-width="4" stroke-linejoin="round" />

    <!-- Cara 3: Pentágono Superior Derecho -->
    <polygon class="face" points="642,343 588,510 740,460 780,280 605,175" fill="#323843" stroke="#12161a" stroke-width="4" stroke-linejoin="round" />

    <!-- Cara 4: Pentágono Inferior Derecho -->
    <polygon class="face" points="588,510 412,510 480,680 670,640 740,460" fill="#1e232a" stroke="#12161a" stroke-width="4" stroke-linejoin="round" />

    <!-- Cara 5: Pentágono Inferior Izquierdo -->
    <polygon class="face" points="412,510 358,343 260,460 330,640 480,680" fill="#252b33" stroke="#12161a" stroke-width="4" stroke-linejoin="round" />

    <!-- Cara 6: Pentágono Superior Izquierdo -->
    <polygon class="face" points="358,343 500,240 395,175 220,280 260,460" fill="#2d333d" stroke="#12161a" stroke-width="4" stroke-linejoin="round" />

    <!-- BISELES Y BORDES NEÓN NARANJA (Estructura Geométricamente Proporcionada) -->
    <polygon class="neon-border" points="500,255 627,347 579,495 421,495 373,347" fill="none" stroke="#ff5500" stroke-width="8" stroke-linejoin="round" filter="url(#glow-orange)" />
    <polygon class="neon-border" points="500,120 590,185 625,330 510,250 405,185" fill="none" stroke="#ff5500" stroke-width="6" stroke-linejoin="round" filter="url(#glow-orange)" />
    <polygon class="neon-border" points="630,355 580,500 720,452 758,288 615,190" fill="none" stroke="#ff5500" stroke-width="6" stroke-linejoin="round" filter="url(#glow-orange)" />
    <polygon class="neon-border" points="580,505 420,505 480,660 655,625 722,462" fill="none" stroke="#ff5500" stroke-width="6" stroke-linejoin="round" filter="url(#glow-orange)" />
    <polygon class="neon-border" points="420,505 370,355 278,462 345,625 480,660" fill="none" stroke="#ff5500" stroke-width="6" stroke-linejoin="round" filter="url(#glow-orange)" />
    <polygon class="neon-border" points="370,355 490,270 390,190 242,288 280,452" fill="none" stroke="#ff5500" stroke-width="6" stroke-linejoin="round" filter="url(#glow-orange)" />

    <!-- ÍCONO MÓDULO IA / CEREBRO -->
    <g id="icon-brain" transform="translate(320, 230) rotate(-15) scale(0.55)">
      <path fill="none" stroke="#ffee00" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-yellow)" d="M -10 -45 C -35 -45 -55 -20 -40 10 C -58 25 -48 55 -20 60 C -30 78 -8 95 12 82 C 2 55 5 20 -10 -45 Z" />
      <path fill="none" stroke="#ffee00" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-yellow)" d="M 10 -45 C 35 -45 55 -20 40 10 C 58 25 48 55 20 60 C 30 78 8 95 -12 82 C -2 55 -5 20 10 -45 Z" />
      <path fill="none" stroke="#ffee00" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-yellow)" d="M -22 5 C -8 15 -12 35 -26 40 M 22 5 C 8 15 12 35 26 40" />
    </g>

    <!-- ÍCONO MICRÓFONO Y TEXTO INTERNO EN PENTÁGONO CENTRAL -->
    <g id="icon-mic" transform="translate(500, 350)">
      <rect x="-16" y="-35" width="32" height="50" rx="16" fill="#00ff66" filter="url(#glow-green)" />
      <path fill="none" stroke="#00ff66" stroke-width="6" stroke-linecap="round" filter="url(#glow-green)" d="M -28 0 A 28 28 0 0 0 28 0" />
      <path fill="none" stroke="#00ff66" stroke-width="6" stroke-linecap="round" filter="url(#glow-green)" d="M 0 28 L 0 45 M -15 45 L 15 45" />
      
      <text id="status-text-title" x="0" y="80" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="2">ESCUCHANDO</text>
      <text id="status-text-sub1" x="0" y="100" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#00ff66" text-anchor="middle" letter-spacing="1">MODO VOZ</text>
      <text id="status-text-sub2" x="0" y="115" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#00ff66" text-anchor="middle" letter-spacing="1">ACTIVADO</text>
    </g>

    <!-- ÍCONO ÉXITO / CHECK -->
    <g id="icon-check" transform="translate(310, 520) rotate(-10)">
      <path fill="none" stroke="#00ff66" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-green)" d="M -18 0 L -4 14 L 26 -14" />
    </g>

    <!-- ÍCONO ERROR / X -->
    <g id="icon-error" transform="translate(680, 520) rotate(8)">
      <path fill="none" stroke="#ff3344" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-red)" d="M -16 -16 L 16 16 M 16 -16 L -16 16" />
    </g>

  </g>
</svg>
